services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: telescrape
      POSTGRES_PASSWORD: telescrape_pass
      POSTGRES_DB: telescrape
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://telescrape:telescrape_pass@db:5432/telescrape}
      JWT_SECRET: ${JWT_SECRET:-telescrape_super_secret_key_123}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  pgdata:
